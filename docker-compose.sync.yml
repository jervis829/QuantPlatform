# Real-Time GitHub -> Local Docker Hot-Sync Overlay
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sync.yml up -d --build

services:
  api:
    command:
      [
        "uvicorn",
        "quant_platform.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/quant_platform",
      ]
    volumes:
      - ./quant_platform:/app/quant_platform
      - ./scripts:/app/scripts

  worker:
    volumes:
      - ./quant_platform:/app/quant_platform

  ui:
    command: ["npm", "run", "dev"]
    environment:
      BACKEND_INTERNAL_URL: ${DOCKER_BACKEND_URL:-http://api:8000}
      WATCHPACK_POLLING: "true"
      TZ: UTC
    volumes:
      - ./frontend/src:/ui/src
      - ./frontend/next.config.mjs:/ui/next.config.mjs
      - ./frontend/tailwind.config.ts:/ui/tailwind.config.ts
      - ./frontend/postcss.config.mjs:/ui/postcss.config.mjs
      - ./frontend/tsconfig.json:/ui/tsconfig.json

  git-sync:
    image: quantplatform-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.11-slim}
    restart: unless-stopped
    working_dir: /workspace
    command: ["python", "/workspace/scripts/github_realtime_sync.py"]
    environment:
      GITHUB_SYNC_REPO_DIR: /workspace
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:-https://github.com/jervis829/QuantPlatform.git}
      GITHUB_SYNC_REMOTE: ${GITHUB_SYNC_REMOTE:-origin}
      GITHUB_SYNC_BRANCH: ${GITHUB_SYNC_BRANCH:-auto}
      GITHUB_SYNC_INTERVAL_SEC: ${GITHUB_SYNC_INTERVAL_SEC:-15}
      GITHUB_SYNC_FORCE_CLEAN: ${GITHUB_SYNC_FORCE_CLEAN:-false}
      QUANT_API_BASE_URL: http://api:8000
      QP_ADMIN_API_KEY: ${QP_ADMIN_API_KEY:-admin-dev-token}
      TZ: UTC
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_healthy
